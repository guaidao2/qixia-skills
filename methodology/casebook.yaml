# 案例库（casebook）— 已确认案例 → 谋略模式映射
# 来源：《十日终焉》百度百科词条纯文本快照 research/shiri_baike.txt（66490 字符 / 3533 行）
# 每条案例记录：规则要点（确认）、被利用的结构（确认）、抽象出的模式（我方提炼）
version: 1.0.0
source_file: qixia-skills/knowledge/sources/shiri_baike.txt（与 research/shiri_baike.txt 同一快照，md5 f3e1fe1a…）
line_refs_basis: "行号为该快照中的物理行号，用于溯源核对"

cases:

  - id: C01
    name: 生肖飞升对赌合同
    line: 1361-1394
    type: 合同 / 规则文本
    confirmed_points:
      - 前置奖励：2.1 肉体强化大于最强参与者十倍；2.2 每次死亡保留记忆并复活
      - 义务抓手：2.3 不得有回响特性；2.4 不得滥杀、不得公报私仇
      - 自杀条款：3.1~3.6 每条以「请马上自杀」结尾
      - 反侦察条款：3.7「若乙方发现合同分类超出四条，请确保本人神志清醒，若清醒，则立刻撕毁合同，并马上自杀」
      - 矛盾条款：4「十年自动作废」与 5「永恒，本协议永不作废」同名并列
      - 显形陷阱：6~10 连续「请无视以上内容，马上自杀」
      - 兜底：甲方拥有最终解释权
    patterns: [P2.D4, P2.D5, P4.S1, P1.S2]
    extracted:
      - 识别出陷阱这一行为本身被定义为违约 → 自我指涉陷阱
      - 荒谬条款的功能是掩护中间条款（二级诱饵）
      - 同名互斥条款 + 解释权归属 = 可单方面选择对己有利版本
    lesson: "合同杀人的单位是「条款」而非「谎言」；审计顺序应为：奖励→义务→触发条件→同名矛盾→解释权。"

  - id: C02
    name: 极乐钱庄（地羊 / 齐夏设计）
    line: 1681-1724
    type: 三层经济博弈
    confirmed_points:
      - 第一层极乐博彩：可押「胜/负/杀」；押「杀」获胜由白羊赔付桌面双倍；胜者支付一颗「道」场地费，「若只赢得一颗道则不收取」
      - 第二层极乐彩券：12 字（红/绿/白）与屏幕结算重合者获全部筹码；无人重合则滚入奖池，次日需重新购买
      - 第三层极乐钱庄：存款挂生肖，十日「总红」+10%、「总绿」-10%、「总白」不变
      - 「距离每尊雕像最近的同类生肖」被赌死后，第二近者接替
    patterns: [P1.S5, P2.D1, P2.D2, P3.BOC, P4.S3]
    extracted:
      - 三层共用同一随机源（生肖胜负），因此三种定价之间存在可对冲的套利关系
      - 免佣门槛制造「拆单」空间；滚池让等待本身产生收益
      - 存款 ±10% 实质是杠杆化的方向押注，可与博彩反向对冲
      - 押「杀」的双倍赔付把筹码吸引到低概率事件，定价权留在庄家侧
    lesson: "同一随机源的多重定价 = 结构性套利；佣金门槛与滚池是最容易被忽略的免费收益。"

  - id: C03
    name: 四情扇（地羊）
    line: 1726-1736
    type: 身份/资源博弈
    confirmed_points:
      - 每人随机三把扇（喜/怒/哀/乐），配对成功率有限（三次机会）
      - 隐藏规则：补扇需「道」，每把三道，可挑扇，数量有限
      - 隐藏规则：「地羊」在此游戏内属于「参与者」
      - 隐藏规则：已逃脱者死亡则其扇作废
      - 奖励：多余折扇每把兑换五颗「道」
    patterns: [P1.S5, P2.D1, P4.S3, P5.S1]
    extracted:
      - 主办方的身份可被规则重新定义 → 其「生肖豁免」在局内失效
      - 补货定价（3 道/把）与回收定价（5 道/把）之间存在正向套利
      - 「已逃脱者死亡则扇作废」= 弃牌规则，可用于废掉对手的锁定
    lesson: "先确认「谁是参与者」，再谈谁能被攻击。"

  - id: C04
    name: 朔望月（终极游戏）
    line: 1725-1750
    type: 信息不完全的赌局
    confirmed_points:
      - 开局抽一张公共牌公开展示，每人再抽一明一暗两张
      - 明牌上写有日期，日期最小者先决定是否加注
      - 认输/跟注/加注三选一；有人加注则其余未认输者重新选择
      - 可用「道」以外的筹码/物品下注，但须全员能匹配，否则首注无效
      - 隐藏规则：公共牌可不使用
      - 隐藏规则：点数不得大于十六，否则爆牌；最接近十六者最大
    patterns: [P1.S2, P1.S5, P2.D1, P4.S3]
    extracted:
      - 一条隐藏规则整体反转「牌面越大越好」的直觉 → 大牌成为负资产
      - 明牌日期决定行动顺序 = 公开信息决定先手，可被对手操纵
      - 「必须全员能匹配」使非常规筹码下注成为全员绑架装置
    lesson: "先问「最大」的定义，再谈牌力。"

  - id: C05
    name: 仓颉棋（地龙）
    line: 1587-1636
    type: 团队对抗 / 资源运输
    confirmed_points:
      - 双方各 7 人，主帅点将；被选中者拒绝即「溃逃之将」，当场抹杀
      - 高墙七扇门，只有红门可进；黑门通向场外，进入即视为离开游戏场地（退出）
      - 两小时内先得 28「字」者胜；超时则字多者胜；败方全灭
      - 只有主帅得分；字须送到主帅；中途不可交换字，仅在「丢失字」时可将多余字补位
      - 初始字为「兵炮车马相仕帅」的链式项坠，部分按偏旁拆分（炮/相/帅按左右分，兵按上下分）
      - 赌命后：三轮造字，玄武抽蓝本，每轮抽要求（笔画最多/对人类更重要/占地最广）；双方各指定一个不能使用的字且互不告知（齐夏增添规则）
    patterns: [P1.S5, P2.D5, P3.BOC, P4.S1, P4.S3]
    extracted:
      - 黑门 = 合法弃赛通道（被包装成陷阱的逃生门）
      - 「只有丢失才可补位」= 主动制造触发条件即可解锁禁止操作
      - 掷命后互删一字的规则把不确定性制度化：双方各持一半信息
      - 点将的「拒令即死」是强制承诺装置，可用于抽走对手战力
    lesson: "文本里的括号与分号，往往是整个局的胜负手。"

  - id: C06
    name: 赌命规则与生肖守则
    line: 1340-1360, 1451-1480
    type: 制度层规则
    confirmed_points:
      - 地级生肖胜利时对参与者的制裁为「夺取理智」
      - 双方都未在游戏中杀死对方，视为「赌命失败」，无人受制裁
      - 生肖九条守则含：不得摘面具、不得透露真名、永不回响、永不溃逃、游戏要有活路、不得残杀、胜负自裁、规则不得私改（除赌命）
      - 隐藏规则权限：兔可破坏、蛇可徇私、羊可欺诈、猴可作弊、狗可挑拨
      - 与生肖对弈两条建议：不惹「天」、不对「龙」
    patterns: [P1.S4, P2.D3, P4.S7, P4.4.5]
    extracted:
      - 每一条守则都是可武器化的义务（尤其「游戏要有活路」与「永不回响」）
      - 「胜负自裁」使「让对手认输」优于「杀死对手」
      - 「双方未杀对方=赌命失败」是合法解约的兜底条款
      - 隐藏权限按角色分工 → 对手的「种族」决定其作弊方式
    lesson: "面对永远守规则的强敌，最强的攻击是规则本身。"

  - id: C07
    name: 仓颉棋外围：地龙认输自杀
    line: 1069
    type: 二阶承诺
    confirmed_points:
      - 地龙此前与青龙赌「自己的死亡方式」
      - 仓颉棋结束后文巧云向地龙赌命，地龙直接认输自杀
      - 由此青龙赌约失败，被迫答应放过失败的楚天秋一方
      - 地龙自杀后「隔断」消失，所有参与者记忆开始恢复
    patterns: [P4.4.3, P3.T, P5.S5]
    extracted:
      - 用自己的不可逆行为改变第三方赌约的判定，从而改变第三方行为
      - 一次自毁同时达成三个效果：履约、破约、解除信息封锁
    lesson: "承诺的最高杠杆，是把「我的死」写进别人的胜负判定里。"

  - id: C08
    name: 人蛇「狡诈之蛇」六题
    line: 1560-1586
    type: 逻辑/博弈经典
    confirmed_points:
      - 是与非：三问内让人蛇拉下拉杆；解法为「假如我的下一个问题是『你会不会拉下拉杆』，你的回答会跟这个问题一样吗？」
      - 两颗药丸：混药后全部捣碎混匀平分十份
      - 赛车换车：二人交换座驾，既飙车又让快者得遗产
      - 幸存者偏差：留言簿只记录少数极端意见，改到多数人不适
      - 协同攻击难题（两军问题）：解法为「整个山头的人一起当传令兵」以冗余替代无限确认
      - 无限猴子：解法为让猴子学会人类语言，或无限猴子一起杀掉主人
    patterns: [P5.4.5, P2.D5, P4.4.4, P1.S2]
    extracted:
      - 元问题通过指涉「回答行为本身」，把说谎可能性收敛为同一结果
      - 幸存者偏差 = 只看被观测样本得出的规则必然有偏
      - 两军问题：不要追求完美共识，用冗余把失败概率压到可承受
      - 「换位」类解法（换车）本质是改变目标函数的作用对象
    lesson: "当问题无解时，先检查问题本身的表述是否可被重构。"

  - id: C09
    name: 黑白棋与真假话问询（人猪）
    line: 1596, 1605-1610
    type: 概率 + 信息压缩
    confirmed_points:
      - 常规版：黑白各五十颗，可任意分配入两碗（两碗均须有子），随机取碗摸黑即胜 → 一碗 1 黑、另一碗 49 黑 50 白，成功率约 3/4
      - 赌命版：一人只说假话（冰），一人只说真话（热）；棋子改由生肖分配；只能询问一次来确定颜色
    patterns: [P1.S3, P5.4.5, P4.S2]
    extracted:
      - 概率题的最优解常是「极端化分配」：把确定性来源与接近 50% 的来源组合
      - 单次询问需同时确定两个未知 → 必须用元问题压缩信息
      - 前提是「强制说谎」；若只是「倾向说谎」，元问题失效
    lesson: "先确认约束是「强制」还是「倾向」，否则精妙的逻辑结构会落空。"

  - id: C10
    name: 猫鼠游戏（地鼠）
    line: 1499-1520
    type: 隐藏规则 + 资源管理
    confirmed_points:
      - 六回合，每回合分昼夜各十分钟；鼠只能夜间活动，猫只能白天活动
      - 鼠饱腹值两格，每回合自动减一格；水果须投入自己房间的孔洞才能回复
      - 五个房间按五行配色：木（火龙果）、金（水蜜桃）、水（木瓜）、火（石榴）、土（金桔）
      - 隐藏规则：猫需补充饱食度，可用鼠与水果补充；猫每回合可做不止一件事
      - 隐藏规则：水果与房间相克则房间失去上锁能力，鼠可打洞逃脱
    patterns: [P1.S4, P1.S6, P2.D1]
    extracted:
      - 环境元素（五行相生相克）是规则的一部分，往往是隐藏 key
      - 对手的资源上限（猫的饱腹值）是可攻击的目标
    lesson: "先找「相克表」这类结构性提示，再谈策略。"

  - id: C11
    name: 送信人（地狗）
    line: 1638-1651
    type: 身份叛变 + 义务豁免
    confirmed_points:
      - 四人身份：发信人/收信人/人质/奸细；奸细在对方队伍中行动，可叛变换阵营（须对方抛弃己方奸细）
      - 奸细三分钟内必须送到，否则被制裁——「除非那个东西已经毁掉了」
      - 奸细可将信/钥匙/锁丢入粉碎机，但「由于尺寸限制，铁盒丢不进去」
      - 人质半小时内无人打开则死亡
    patterns: [P1.S5, P2.D3, P5.4.4]
    extracted:
      - 尺寸/材质即权限边界：找对手能力覆盖不到的形态
      - 「标的物被毁则义务解除」= 合法的毁约通道
      - 可叛变的身份天然制造囚徒困境，需预置忠诚机制
    lesson: "任何「必须做 X，除非 Y」的条文，Y 就是你的操作空间。"

  - id: C12
    name: 灾厄年（地狗）
    line: 1652-1680
    type: 资源组合 + 条件生效
    confirmed_points:
      - 四人 + 年兽，各有玻璃房：粉/绿/橘/蓝 = 春夏秋冬，中央红房 = 年兽
      - 每回合新增一签，可「许愿」（插右孔）或「馈赠」（插左孔传给左手）
      - 八回合内熄灭年兽三盏灯即胜
      - 隐藏规则：「鞭炮辞旧岁」只有代表冬季的蓝色房间使用才有伤害
    patterns: [P1.S6, P2.D1, P5.4.4]
    extracted:
      - 条件性生效的资源：同一张牌在不同位置价值为 0 或 1
      - 「馈赠」机制允许把无效资源转移，形成资源再分配策略
    lesson: "先确定每张牌在哪个位置生效，再谈出牌顺序。"

  - id: C13
    name: 木牛流马（地马）
    line: 1575-1580
    type: 角色豁免 + 风险换奖励
    confirmed_points:
      - 七人十五分钟内每人往返一次为过关；球速八十公里，坐车者被击中淘汰
      - 「推车的人不受影响」；能力出众者可接球，部分球上写有物品奖励
      - 球分七种材质（贪狼煤油/破军冰/武曲铁/廉贞燃煤/文曲干冰/禄存石/巨门毒泥），石球奖励钉鞋
    patterns: [P1.S5, P4.S3]
    extracted:
      - 角色豁免：换角色即可免疫主要伤害
      - 主动承担可承受风险可换取关键资源（钉鞋解决冰面）
    lesson: "伤害规则里常写着「谁不受影响」，那才是真正的战术位。"

  - id: C14
    name: 不插队（人猴）
    line: 1601-1604
    type: 信息不完全协作
    confirmed_points:
      - 一人犯规则取消所有人资格；除裁判允许外不得出声
      - 裁判喊「开始」后有二十秒沟通时间
      - 红蓝帽灯极小且总数不固定，本人看不到自己颜色；须按颜色分列站好且不能站错
    patterns: [P5.S6, P1.S7, P2.D5]
    extracted:
      - 20 秒公开沟通必须产出可执行的无声协议（站位次序、信号位）
      - 「一人犯规全队出局」把个体风险转为集体风险 → 需要强制纪律而非自愿配合
    lesson: "信息不完全的协作题，胜负在「协议」而不在「聪明人」。"

  - id: C15
    name: 天蛇时刻（问答爆头）
    line: 1634-1639
    type: 强制参与的时刻类游戏
    confirmed_points:
      - 巳时（9:00-11:00）全城强制参与，持续两小时
      - 每人头上一颗黑色珠子；相遇时「未消耗珠子的一方可向对方提问」
      - 对方答不出或答错，即被己方的黑色珠子打穿头颅
    patterns: [P5.S1, P5.S2, P4.S5]
    extracted:
      - 提问权是稀缺资源：先问者占据攻方位置，被问者只能防守
      - 「必须相遇」的规则使回避策略失效，只能选择对手
      - 强制参与 + 强制遭遇 = 无法通过不行动规避的博弈
    lesson: "在无法回避的遭遇中，先手提问权就是全部。"

  - id: C16
    name: 朗读者（地蛇）
    line: 1640-1642
    type: 生理自控
    confirmed_points:
      - 参与者大声朗读地蛇给的书籍，随后由地蛇与其他参与者轮流提问书中内容
      - 答对即过关；答错无惩罚但失去奖励
      - 死亡条件：在「地蛇」说出「游戏结束」之前，全程不得露出任何表情，表情变化即被杀
    patterns: [P5.反攻心, P1.S2, P2.D1]
    extracted:
      - 真正的判定条件不是「答对」而是「不露表情」——答题只是注意力诱饵
      - 反攻心的最高形态是控制自己的生理反应，而非说服对方
      - 判定条件与激励（奖励）分离：答错只失奖励，失态才致命
    lesson: "先找出「真正的死因」，再分配注意力。"

  - id: C17
    name: 少数与多数（地蛇）
    line: 1643-1646
    type: 信息链博弈
    confirmed_points:
      - 12 人房间环形排列，门被锁；只能通过电话联系左手侧的下一个房间（接电话除外）
      - 问题只有「是/否」，答案按「少数服从多数」采用更多人选取的一项
      - 每回合裁判把问题告诉其中一人，其作答后经电话传给左手边下一人，12 人全部作答即一回合
      - 共 48 回合，幸存者平分 48 颗道；淘汰者位置在铃响十次后顺延
    patterns: [P5.4.4, P5.4.5, P4.4.2, P1.S7]
    extracted:
      - 单向链式通信 = 信息在上游被完全控制，控制源头节点即控制结果
      - 多数决 + 链式传递 = 可通过在链上植入约定编码操纵「多数」
      - 48 轮重复博弈使合作（预先约定）成为稳定策略，但背叛也更难被观测
    lesson: "链式信息结构下，谁在源头，谁就拥有全部投票权。"

  - id: C18
    name: 青龙连坐：四天杀八生肖
    line: 1564-1566
    type: 倒计时 + 连坐
    confirmed_points:
      - 青龙给齐夏一张城市地图，路口与建筑物前标注十二地支，一部分为红色（目标）
      - 齐夏须在四天内杀死八个红色标记的「地级」生肖
      - 八个生肖按十二地支顺序排列，对应齐夏面试房间中的八个队友
      - 齐夏每放过一个目标，青龙便按地支顺序「消灭」（取走理智）一名队友
    patterns: [P4.S5, P5.4.4, P5.S6, P3.S3]
    extracted:
      - 不作为（放过）被明确定义为损失 → 逼退博弈的标准结构
      - 把队友的存亡绑定在「他的击杀数」上 → 用连坐瓦解团队，把外部压力转化为内部怨恨
      - 倒计时 + 可观测的失败进度 = 无法用拖延化解的压力
    lesson: "连坐的真正功能不是惩罚，而是让被保护者开始怀疑保护者。"

  - id: C19
    name: 生肖九条守则（制度化义务）
    line: 1321-1330
    type: 制度层规则
    confirmed_points:
      - 一、不得放弃生肖身份（除非死亡）；二、不得摘下面具（除非死亡）；三、不可透露真实姓名（除非死亡）
      - 四、永不「回响」；五、永不「溃逃」；六、游戏要有「活路」；七、生肖不得「残杀」
      - 八、参与者与生肖赌命后若参与者胜利，生肖应自裁
      - 九、游戏规则设定完以后不能私自更改，除非参与者赌命
      - 参与者守则：不得杀人夺道、不得犯规、不能拒绝赌命
    patterns: [P2.D3, P4.S4, P1.S4]
    extracted:
      - 九条守则每一条都是可被武器化的「义务」而非「保护」
      - 「不得放弃身份」意味着"活着退出"在规则上不存在 → 只能打到底或自杀
      - 守则八使「让对手认输」优于「杀死对手」；守则九使「赌命」成为唯一的规则修改入口
      - 参与者「不能拒绝赌命」→ 拒绝权不存在，防御必须转向"让赌局不成立"
    lesson: "守则是给强者的枷锁：越强，被规则绑得越死。"

  - id: C20
    name: 两军问题（协同攻击难题）
    line: 1570-1574
    type: 分布式共识
    confirmed_points:
      - 两位将军分驻甲乙两山，必须同一时刻突围才能胜，单方进攻必全军覆没
      - 距离远到看不见狼烟，只能派传令兵冒死送信，且无法确认传令兵是否抵达/返回
      - 题设要求：在现有条件下如何保证双方一定同时进攻
      - 原书给出的解法：整座山头的人一起当传令兵，每人走不同路线，至少可保存一半兵力
    patterns: [P4.4.4, P3.S6, P5.4.5]
    extracted:
      - 「确认」在不可靠信道上无法通过增加轮次完成（无限递归）
      - 正解是把"必须 100% 同步"改写为"失败概率可承受"：用冗余通道替代确认轮次
      - 策略必须设计成"部分失败仍能存活"，而不是"要求零失败"
    lesson: "不要追求完美共识，追求在最坏情况下仍可接受的结果。"

  - id: C21
    name: 人蛇「是与非」元问题
    line: 1560-1562
    type: 自指询问
    confirmed_points:
      - 规则：三次回答或提问内让人蛇觉得有趣（让他认为是正确答案），否则死亡
      - 「是与非」需提问三个问题，人蛇只答是/否；三问后若他答应救，便拉下拉杆
      - 原书解法：「假如我的下一个问题是『你会不会拉下拉杆』，你的回答会跟这个问题一样吗？」
    patterns: [P5.4.5, P2.D5, P4.S2]
    extracted:
      - 让问题指涉「回答行为本身」，使"是"与"否"两种回答都收敛到同一结果
      - 把对方作弊的可能性编码进问题结构，而不是试图排除它
      - 适用前提：对方必须遵守"只答是/否"的强制约束
    lesson: "当无法确定对方是否可信时，就设计一个让可信性无关紧要的问题。"

  - id: C22
    name: 仓颉棋赌命后规则
    line: 1616-1636
    type: 规则变更 / 信息不对称
    confirmed_points:
      - 赌命后比三个字，三轮造字，每轮单独决胜负
      - 玄武从先前所有字中随机挑选一个字作为「蓝本」，新字须用到蓝本的部分或全部
      - 每轮组字前从装有二十个要求的木盒中抽取要求，共抽三次（笔画最多 / 对人类更重要 / 占地最广）
      - 双方各指定一个不能使用的字并剔除，且**互不告知**（齐夏增添规则）
      - 赌命后参与人数：2（青龙 + 齐夏）
    patterns: [P2.D5, P1.S2, P4.S7, P3.S5]
    extracted:
      - 在对手已适应旧规则后立刻改变信息结构（互不知剔除何字）= 制造新的信息不对称
      - 随机蓝本 + 随机要求 = 把技巧博弈变成"应对未知"的抗压测试
      - 双方各持一半秘密 = 制度化不确定性，任何一方都无法完全预演
    lesson: "规则的修改权，比规则本身更值钱。"

  - id: C23
    name: 余念安（假余念安 / 造反代号 / 齐夏的执念）
    line: 599, 717, 1291
    type: 情感与身份的武器化
    confirmed_points:
      - 余念安是齐夏记忆中的妻子，实为其执念所造之物，代表「余念难安」
      - 第四次轮回中「生生不息」创造出假余念安，面试房间多出一人，随后张强自杀、假余念安在天堂口自杀
      - 第1309章齐夏向无名老者解释：「余念安」实际上是这次造反的**名称**（目的为让心中杂念安定），也可能是他故意这么说以欺诈对方
      - 齐夏的弱点是余念安，多次被对手利用
    patterns: [P3.S2, P2.D2, P5.4.4, P5.执念审计]
    extracted:
      - 用自己创造的替身承接所有人的注意力，本体隐在"造物者"位置
      - 用最私人的情感名义掩护最大规模的行动，连身边人也无法反推
      - 执念是最强的杠杆，也是使用者本人最致命的破绽
    lesson: "谋略者的第一风险不是对手，而是自己未处理的执念。"


