# 齐夏战例库（qixia_battles）
# 定位：只收「齐夏本人在某个具体局面里做的事」，以及从该局面可复用的决策结构。
# 证据基线：qixia-skills/knowledge/sources/shiri_baike.txt（3533 行）
# 证据标签见 evidence_policy.md
#   what_happened 只写 E2（词条直接陈述的事件）；rule_basis 只写 E1（词条原文规则）；
#   breakpoint / failure_lesson / counter 一律 E3（我方提炼，不得当成剧情转述）。
# 去重：与 methodology/casebook.yaml 的 C01–C23 重叠部分在 dedupe 中登记，仅记录增量。
version: 1.0.0
source_file: qixia-skills/knowledge/sources/shiri_baike.txt

cases:

  # =====================================================================
  - id: Q01
    name: 七十年前·频率誓言（把承诺写进自己的触发条件）
    category: 承诺设计
    timeline: 约七十年前（初次清洗）
    lines: "126-130,577,592,1283"
    what_happened:
      - 七十年前所有人一同来到终焉之地，天龙背叛造神计划并试图杀死所有人
      - 齐夏当场发动「生生不息」，当时只有「青龙」听见了这个频率
      - 齐夏当众立誓：所有参与者会再度回来，回响者会带着惨痛记忆领导众人前进，直到把天龙完全打倒
      - 此后所有人在打败双龙前无论死多少次都会被复活（重造），形成十日循环
    rule_basis:
      - 「生生不息」以信念或潜意识创造人（line 127）
      - 十日轮回是因为生生不息一直都在（line 130）
      - 「回响」需要信念/执念触发，通常先在「起初阶段」借助契机，多次感受后可主动发出（line 101）
    breakpoint:
      - 齐夏的誓言对象不是对手，而是自己的回响触发条件：宣言内容=「所有参与者会回来」，而回响效果=「创造人」⇒ 一句话同时锁定了复活机制与队伍的记忆传承
      - 于是「死亡」从损失项变成资源项：每一次清洗都在为下一轮的队伍补货，且记忆随回响者延续
      - 可执行抽象：把公开承诺写成你自己的触发条件（而不是写给对方的保证），承诺就获得制度性执行力
    failure_lesson:
      - 代价是所有人被困在循环里，胜利条件被推迟到「打败双龙为止」，即胜利变成无限期债务
      - 只要你还在循环里，你的敌人也还在；拖延对掌握「离析」的一方更有利
    counter:
      - 若你是对手：不要阻止对方的誓言，要让誓言的前提失效（例如让「回来的人」不再是同一批人）
    patterns: [P4.S1, P4.不可撤回装置, P3.跨期复利, P5.S5]
    dedupe:
      - relation: distinct
    evidence: E2

  - id: Q02
    name: 十年前·天秤游戏之败与「不幸者」封印
    category: 规则侦察（失败样本）
    timeline: 十年前
    lines: "577,1285,1567-1571"
    what_happened:
      - 齐夏率万人挑战「天龙」，最终输于「天秤游戏」
      - 此后他封印自身的「回响契机」，成为「不幸者」
      - 原回响「灵闻」，回响契机为悲伤（已切断）
    rule_basis:
      - 天秤游戏规则全文只有一句「在巨大的天秤上，分为两方，重者获胜」（line 1569）
      - 参与人数为 10000+2（天龙、青龙）（line 1570-1571）
    breakpoint:
      - 一万名参与者对两名神，若按人数计重则参与者必胜；而结果是齐夏战败 ⇒ 说明「重」不以人数计量，或存在额外配重。原文未给出败因，此推断为 E3
      - 因此本局的败点不在战术，而在判定函数的所有权：谁定义「重」，谁就已经赢了
      - 失败后的处置同样值得学：切断「悲伤」这一契机，等于删除自己被对手可预测的触发开关（灵闻仍可用但不再由悲伤启动）
    failure_lesson:
      - 任何单一形容词作为胜负标准的局，必须在开局前把形容词量化并拿到测量权，否则所有准备都是替对手做的
      - 失败之后的第一动作应是「改判定函数/改触发器」，而不是「再来一次」
    counter:
      - 若你是对手：维持判据的模糊性就是你的护城河；一旦给出量化标准，优势立刻转移到掌握资源的一方
    patterns: [P1.S3, P1.S2, P2.D5, P5.留退路]
    dedupe:
      - relation: distinct
    evidence: E2

  - id: Q03
    name: 七年前·生肖渗透（从参赛者变成出题人）
    category: 制度设计
    timeline: 七年前
    lines: "577,1286,1081,1053,1058,1048,1084,1091,1105,842,846,1119"
    what_happened:
      - 齐夏成为生肖（地羊/白羊），并使「生肖」整体的「游戏强度」大幅上升
      - 冲击「天羊」时遇见天龙，被摆了一道，记忆丢失，重新成为「参与者」（即消失的七年）
      - 他在生肖中留下多名「针」（地虎、黑羊、人蛇、人鼠等徒弟），并在面试房间以白羊身份引导燕知春、安排张强接替人羊
    rule_basis:
      - 生肖九条守则，含不得放弃生肖身份（除非死亡）、永不回响、永不溃逃、游戏要有活路、规则不得私改（除赌命）（line 1321-1330）
      - 「生肖」可以隐藏部分游戏规则，兔可破坏、蛇可徇私、羊可欺诈、猴可作弊、狗可挑拨（line 1479）
      - 参与者不能拒绝赌命（line 1320）
    breakpoint:
      - 成为出题人 = 获得「规则生成权」：不必赢下任何一局，只需设计别人必须面对的局
      - 「提升整体游戏强度」是一个系统级杠杆：它同时筛选参与者（弱者死于局中）和积累复活池（生生不息）
      - 徒弟制是最便宜的组织建设：徒弟在同一制度内升迁，等于把自己的权限复制到多个节点
    failure_lesson:
      - 晋级路径上的关键节点（天羊）由更高权限者掌控，且其规则可以「摆你一道」⇒ 在别人的晋升阶梯上冲顶，永远受制于阶梯的所有者
      - 一旦被抹除记忆，所有既有布局都变成不可继承的遗产（除非像「针」那样保留了记忆）
    counter:
      - 若你是对手：让对手晋升，然后在新身份上重置他（晋升即重置是最省力的清除方式）
    patterns: [P1.S4, P2.D1, P3.跨期复利, P5.画像]
    dedupe:
      - relation: distinct
    evidence: E2

  - id: Q04
    name: 八个队友入生肖队·永久回响者（用规则矛盾造出规则外身份）
    category: 制度设计
    timeline: 七年至主故事
    lines: "108-109,637"
    what_happened:
      - 齐夏原本房间的八个队友（地牛、地兔、地龙、地蛇、地猴、地鸡、地狗、地猪）依据他的计划打入生肖队伍，任「列车接引者」，各自完成计划的一部分，且都是「永久回响者」
    rule_basis:
      - 若一人戴上面具之前先行获得「回响」，其身份在戴面具那一刻逆转为「生肖」；又因「生肖永不回响」，他既无法获得也无法摆脱回响，成为「永久回响者」
      - 该方法有极大弊端：绝对不能被任何管理者（神兽或天龙）发现，否则下次见面就是「蝼蚁」（line 109）
      - 「回响」存在于回响者的眼睛里，移植眼球可获得回响（line 109）
    breakpoint:
      - 这是用两条规则交叉制造出的「规则里不存在的身份」：面具把人变成生肖，而生肖禁令又让回响无法被清除 ⇒ 不可解的状态就是不可检测的伪装
      - 它同时解决了两个矛盾目标：既获得生肖的神力与场地权限，又保留回响
      - 可执行抽象：找到两条互相锁死的条款，让它们在你身上同时生效，你就获得了监管者无法归档的身份
    failure_lesson:
      - 伪装的安全性完全依赖「管理者不来观察」这一外部条件；一旦被神兽或天龙发现，惩罚是降级为蝼蚁（比死更差）
      - 因此这类身份不能规模化、不能公开、不能在关键节点集中出现
    counter:
      - 若你是管理者：只要定期做一次「回响者普查」，就能一次性清除整网
    patterns: [P1.S4, P2.D1, P3.C, P3.S3]
    dedupe:
      - relation: distinct
    evidence: E2

  - id: Q05
    name: 面试房间·生肖飞升对赌合同（自动执行的合同）
    category: 规则欺骗（合同工程）
    timeline: 主故事开局（本合同早于故事存在，乙方为人羊张强）
    lines: "1361-1400,1122-1124,1291,1288-1291"
    what_happened:
      - 甲方为阴魂管理局委托代理人天龙，乙方为生肖代号人羊张强
      - 合同给乙方飞升机会、乙方为甲方选拔面试者；乙方自愿进入面试房间成为房间主理人
      - 第一轮回韩一墨死于「雨后春笋」、陈俊南死于「人羊立威」；第四轮回「生生不息」创造假余念安使面试房间多出一人，随后张强（人羊）自杀
    rule_basis:
      - 1.1 合同适用于人级生肖，签订时须确认已无剩余「道」，并自愿成为房间主理人（line 1366）
      - 2.2 甲方保证乙方每次死亡后保留记忆并复活，直至合同完成或乙方违约（line 1374）
      - 3.6 参与者人数应小于等于九人；若发现多于九人，须先确认神志清醒，若清醒则设法杀死多余人员，并在游戏结束后自杀（line 1385）
      - 3.7 若发现合同分类超出四条，请确保神志清醒，若清醒则立刻撕毁合同并马上自杀（line 1386）
      - 4 与 5 同名并列：一份写「十年后自动作废」，一份写「永恒，本协议永不作废」（line 1387-1392）
      - 6-10 连续「请无视以上内容，马上自杀」（line 1393-1397）；甲方拥有最终解释权（line 1398）
    breakpoint:
      - 因果链（E3 推断，两端均有 E1/E2 支撑）：3.6 规定「多于九人须杀死多余者且事后自杀」；第四轮回生生不息造出第十人；结果是主理人张强自杀
      - 合同最狠的设计不是条款内容，而是「由签署者自己执行」：所有危险条款都以「请马上自杀」结尾，制裁成本为零
      - 反侦察条款（3.7）把「发现合同异常」这个行为本身定义为违约 ⇒ 任何审计行为都会触发自我制裁
      - 4 与 5 的同名矛盾 + 最终解释权 = 甲方可单方面选择对己有利的版本
    failure_lesson:
      - 只逐条读条款不足以自救：必须按「奖励→义务→触发条件→同名矛盾→解释权→生效条件」的顺序做一次完整审计
      - 真正的破法是攻击生效条件（1.5/2.5 神志条款，line 1370 与 1377：只须证明签署方思维不正常，或双方签约时非神志清醒，合同即自动作废），而不是攻击条款
    counter:
      - 若你面对同类合同：先找出「合同何时失效」的条款（通常是神志/条件条款），再找出「谁有权认定」，最后争夺认定权
      - 若你是甲方：解释权 + 自我执行条款是最廉价的控制结构，但要留一条名义活路避免制度反弹
    patterns: [P2.D4, P2.D5, P1.S2, P4.S1]
    dedupe:
      - relation: extends
        ref: C01
        what_is_new: C01 已逐条收录 2.1/2.4/3.1-3.7/4-10 与「甲方最终解释权」；本条新增三点。(1) 乙方身份确认——人羊张强，合同因此可被追溯到具体执行者；(2) 3.6「参与者须≤9 人，多于九人须杀多余者并于游戏结束后自杀」与第四轮回「生生不息造出第十人→张强自杀」构成一条此前未登记的因果链（E3 推断，两端均有原文支撑）；(3) 1.1 的「须确认已无剩余『道』」是乙方被剥夺资源后才签下合同的前置条件。
    evidence: E2

  - id: Q06
    name: 面试房间·协作合同与「问题本」身份验证器
    category: 信息设计 / 身份验证
    timeline: 主故事开局前的遗留布局
    lines: "1402-1403,1119,842,846,1122-1124"
    what_happened:
      - 「面试房间协作合同」签下后成为面试房间「协助者」，不需再交「道」
      - 人蛇是齐夏所在面试房间的协助者，其面试游戏为「是与非」「两颗药丸」
      - 人蛇提出的问题来自白羊临走前留给他的本子；白羊承诺若他能答出所有问题就回来助他成为地级，但本人并不希望白羊回来，故十分犹豫
      - 人蛇发现齐夏后，尝试让他解答问题以验证其是否为白羊
      - 白羊（齐夏）曾引导燕知春成为棋子；张强接受白羊的计划接替其成为面试房间的人羊，换取绝对的安全
    rule_basis:
      - 协作合同：签下后成为「协助者」，不需再交「道」（line 1402-1403）
      - 面试房间由「协助者」与「主理人」共同主持面试游戏（line 1239）
      - 生肖守则第三：不可透露真实姓名（除非死亡）（line 1324）
    breakpoint:
      - 这是一个「身份验证协议」：白羊把自己的身份编码成一个只有自己知道答案的题库，交给守门人；于是他既能远程验证「谁能冒充我」，又能被自己的题目认出
      - 承诺设计极省成本：「答出所有问题我就回来」把一个大承诺挂在一个可验证的小条件上，且不需要任何抵押
      - 缺陷同样清楚：验证器同时是泄露点与复活手段（原文称人蛇是「白羊的复活手段」），守门人一旦动摇，整套身份体系崩解
    failure_lesson:
      - 用题库做身份验证的同时，等于把「我是谁」的判定权交给了出题对象；守门人的意愿比题目本身更关键
      - 依赖「对方不希望我回来」这种动机差异来维持控制，是不可持续的（人心一旦变化，验证器就会沉默）
    counter:
      - 若你继承这类体系：先测守门人的动机（他想不想你回来），再决定是否使用题库
      - 若你要建立验证器：把答案分散给多个互不通信的守门人，避免单点
    patterns: [P1.S6, P5.画像, P4.S4, P3.S2]
    dedupe:
      - relation: distinct
    evidence: E2

  - id: Q07
    name: 四轮回迭代（每轮只改一个变量的实验链）
    category: 连环布局
    timeline: 主故事四轮回
    lines: "1288-1291"
    what_happened:
      - 第一轮回：带众人走出面试房间（韩一墨死于雨后春笋、陈俊南死于人羊立威），未能成功回响，见到林檎
      - 第二轮回：率众逃出（陈俊南死于张强之手），韩一墨死于七黑剑，乔家劲与张丽娟死于潇潇之手，李尚武死于失血过多；齐夏临死前唤醒许流年，成功回响
      - 第三轮回：率众加入天堂口；肖冉被朱雀取走理智，苏闪回响后死亡；极道与天堂口对决，天堂口获胜；楚天秋请「猫」血洗天堂口；齐夏死于「杀人夺道」（许流年故意如此，玄武制裁），死前激荡惊动天龙
      - 第四轮回：生生不息创造假余念安，面试房间多出一人；张强自杀；假余念安在天堂口自杀；地蛇死于陈俊南赌命；人员兵分三队；天马发动天马时刻；齐夏在留存记忆中与青龙首次相见
    rule_basis:
      - 参与者守则：参与者间不得杀人夺道、不得犯规、不能拒绝赌命（line 1317-1320）
      - 触及「公正」由玄武出面，触及「犯规」由朱雀出面（line 1314）
      - 「生肖」等级为地级时，对参与者的制裁为「夺取理智」（line 1356，赌命规则第 7 条）
    breakpoint:
      - 四个轮回更像是四次单变量实验：轮1测「能否出房间」、轮2测「回响如何触发（临死）」、轮3测「规则执行者如何裁决（杀人夺道→玄武制裁）」、轮4测「用生生不息改变人数会触发什么（合同 3.6）」
      - 每轮改变的是信息结构（谁知道什么、谁在场），而不是战斗力
      - 可执行抽象：把「重复」当成实验预算，每一轮只改一个变量，并把观测结果写进下一轮的开局条件
    failure_lesson:
      - 每一轮都近乎全灭：迭代的代价由队友承担，这是「轮回型资源」最容易被忽视的伦理与组织成本
      - 第三轮回说明：在规则体系内杀人是可控的（会被制裁，但制裁有明确执行者），因此可以利用「制裁」本身作为触发器（死于杀人夺道→激荡成功）
    counter:
      - 若你是对手：不要阻止对方重来，要阻止对方「记得」——每轮清除其记忆就使其无法做单变量实验
    patterns: [P3.跨期复利, P1.S6, P4.S2, P3.S6]
    dedupe:
      - relation: distinct
    evidence: E2

  - id: Q08
    name: 仓颉棋·黑门作为合法弃赛 + 赌命后改写信息结构
    category: 规则侦察 / 规则变更
    timeline: 造反派阶段
    lines: "1587-1625,1069"
    what_happened:
      - 仓颉棋由青龙特邀，地阴龙主持，齐夏一方与青龙对阵
      - 赌命后两人（青龙+齐夏）比三个字，三轮造字；齐夏增添了「双方各剔除一个不能使用的字且互不告知」的规则
      - 仓颉棋结束后文巧云向地龙赌命，地龙直接认输自杀，使青龙赌约失败而不得不放过失败的楚天秋一方（详见 C07）
    rule_basis:
      - 高墙七扇门只有红门可进，黑门通向场外，进入即视为离开游戏场地（退出）（line 1600 附近）
      - 两小时内先得 28 字者胜，超时则字多者胜，败方全灭（line 1604）
      - 只有主帅得分，字须送到主帅，中途不可交换，仅在「丢失字」时可补位（line 1611-1613）
      - 主帅点将的目标只能是「参与者」，若试图选择非参与者，将被地龙亲自制裁（line 1594 附近）
      - 赌命后三轮造字、玄武抽蓝本、每轮抽要求、双方各剔除一字且互不告知（line 1616-1624）
    breakpoint:
      - 黑门是全篇最干净的「规则原文即逃生门」：文本把它写成陷阱，功能却是合法弃赛
      - 「只有丢失才可补位」= 条件式禁令 ⇒ 先制造条件（宣称丢失），即可合法执行被禁止的操作
      - 齐夏在赌命后立刻追加「互不告知剔除字」，等于在对手适应旧规则的一瞬间改写信息结构，制造新的信息不对称
      - 点将限制（只能选参与者）既是限制也是武器：若对手试图点非参与者，受损的是主持人（地龙）而不是你
    failure_lesson:
      - 规则改动只能通过「赌命」这一入口（守则九），因此想在局中改规则，必须先接受赌命的风险
      - 一旦进入赌命，人数从 14 降到 2，团队优势全部作废 ⇒ 改规则的门票是「放弃你的规模优势」
    counter:
      - 若你是对手：在赌命前把「可修改项」的清单固定下来，避免对方在赌命后追加条款
      - 若你主持：黑门这类退出阀必须保留，否则触碰「游戏要有活路」
    patterns: [P1.S5, P2.D5, P3.BOC, P4.S1, P4.S3]
    dedupe:
      - relation: extends
        ref: C05
        what_is_new: C05 已收录黑门、丢失补位、点将拒令即死与赌命后三轮造字；本条新增「主帅点将只能选参与者，否则由地龙本人受制裁」这一反用（把限制变成对主持人的讹诈位），以及赌命把人数从 14 压到 2「规模优势全部作废」这一成本结构。
      - relation: extends
        ref: C22
        what_is_new: C22 已收录互不告知的剔除字规则；本条补充它的战术定位——不是「增加趣味」，而是在对手适应旧规则的瞬间重置信息不对称。
    evidence: E2

  - id: Q09
    name: 朔望月·先确认「最大」的定义
    category: 信息侦察
    timeline: 造反派阶段（地猴局）
    lines: "1725-1729,2483-2493"
    what_happened:
      - 朔望月为「终极游戏」，由猴类局序列引出（地猴赌场之后）
      - 原文记录其完整规则三条隐藏规则；未记载齐夏在该局中的具体操作
    rule_basis:
      - 公共牌可不使用；纸牌点数不得大于十六，否则爆掉；最接近十六的数视为最大（line 1728-1729）
      - 明牌上写有日期，日期最小者先决定是否加注；有人加注则其余未认输者重新开始三选一（line 1727）
      - 非常规筹码须全员能匹配，否则首个物品下注无效（line 1728）
    breakpoint:
      - （E3 推演，非剧情）该局的最优打法在开局前就已确定：先问「点数如何合成一个数」「超过 16 如何处理」，再决定是否参与
      - 隐藏规则把「大牌=强」整体反转，因此拿到大牌的人反而应当认输或加注逼退，形成「弱者先手更有利」的反直觉结构
      - 「必须全员能匹配」可被用作库存探针：故意下一笔无人能匹配的非常规注，可无成本地读到全场资源状况
    failure_lesson:
      - 若按直觉（牌面越大越好）行动，隐藏规则一旦生效，牌力越强亏得越多
      - 原文未记载齐夏的具体打法 ⇒ 本条的战术部分必须标为推演，不能当作史实引用（这正是本案例库区分 E2/E3 的原因）
    counter:
      - 若你面对同类隐藏规则：在第一次下注前用最小注测一次「结算函数」（例如故意爆牌一次），比任何推理都便宜
    patterns: [P1.S2, P1.S5, P2.D1, P4.S3]
    dedupe:
      - relation: extends
        ref: C04
        what_is_new: C04 已收录朔望月全部规则与三条隐藏规则；本条明确划出证据边界——原文未记载齐夏在该局的具体操作，因此战术部分只能是 E3 推演；并新增「用不可匹配下注做库存探针」这一可执行动作。
    evidence: E2

  - id: Q10
    name: 天龙与青龙的双向承诺（三方对赌结构）
    category: 对赌设计
    timeline: 主故事后期至终局
    lines: "640-643,688,702,1149"
    what_happened:
      - 青龙本意与齐夏合作杀死天龙，重整桃源成为唯一统治者；最终被齐夏设计打倒而消失
      - 天龙本意与齐夏合作前往「第三站」建立新世界并成为其统治者；最终被齐夏设计为所有参与者建立了新世界，并被齐夏的血肉世界打败消灭
      - 天龙利用「双生花」使自己与青龙绑定在一起
      - 青龙因天龙「双生花」的原因，无法直接对天龙进行攻击造成伤害
    rule_basis:
      - 「双生花」是回响之一，效果为绑定（见天猴回响，「双生花」「原物」「疯长」）（line 1041）
      - 神兽之首青龙的回响包括灵闻、缄默、跃迁、滞空、惊雷、夺心魄（line 1149）
    breakpoint:
      - （E3）这是一个三方对赌：两个神都想利用齐夏，齐夏同时向双方承诺了不同的终局
      - 双方互锁（双生花使青龙无法伤害天龙）⇒ 齐夏成为「唯一还能行动的一方」，其价值不在于强，而在于可动
      - 结构要点：只要让两强互相锁定，第三方的全部筹码就是「行动权」本身
      - 结算层的偷换：天龙以为自己在建新世界，实际「新世界」被齐夏用来反杀——同一份合约被两边解释成不同东西
    failure_lesson:
      - 三方对赌的最大风险是任何两方私下和解；齐夏的解法是让和解在物理上不可能（双生花），而不是靠信任
      - 一旦第三方（齐夏）兑现了其中一方的承诺，另一方的承诺立即变成债务
    counter:
      - 若你是两强之一：先确认对方与第三方的合约是否和你手上的版本一致（同名不同义是三方博弈的常态）
    patterns: [P4.三方对赌, P4.隔空对赌, P3.T, P2.D5]
    dedupe:
      - relation: distinct
    evidence: E2

  - id: Q11
    name: 造人计划（造动机、造棋子、造世界）
    category: 连环布局
    timeline: 贯穿全程
    clue_refs:
      - 第 476 章「造人计划」（E4 标题线索，仅用于定位；本条证据是下方 E1/E2 原文）
    lines: "84-85,622,707,837,1291,1242-1243,2323"
    what_happened:
      - 燕知春是齐夏通过生生不息重构的人物，具备原本记忆与强化智力，是四季角色之「春」，领导极道，被称「极道王」；手指关节文有 YNA
      - 余念安是齐夏为「让自己保证维持反抗的动力」而创造出来的；以燕知春的身体与江若雪的性格为蓝本
      - 余念安的外形来自燕知春，面庞来自「业力」母神，性格表情来自齐夏本身
      - 第四轮回中生生不息创造了「假余念安」，面试房间多出一人；假余念安两次自杀
      - 齐夏在永恒中用生生不息创造了一个新世界（血肉世界），并通过「门」回到终焉之地
    rule_basis:
      - 生生不息：以信念或潜意识创造人；激荡契机为「心安」（line 127,578）
      - 回响需信念/执念触发，过度使用会导致思维认知混乱（line 101,103）
    breakpoint:
      - 造人计划有三个用途层：① 造动机——齐夏「不在乎人命、没有绝对动机」，于是给自己造一个必须战斗的理由（余念安），把性格缺陷补成一个驱动器
      - ② 造棋子——燕知春（智力强化后成为最关键的执行者）、假余念安（占位，触发面试房间的合同 3.6）、新的陈俊南（抹掉与地蛇对赌的记忆以重置其状态）
      - ③ 造世界——血肉新世界，既是终局的结算层，也是唯一能带走的战利品
      - 可执行抽象：当组织缺动机时，造一个「象征物」比讲道理便宜；当缺执行者时，复制一个被强化过的模板人比培训便宜。但象征物会变成可被攻击的开关
    failure_lesson:
      - 造出来的动机不可质疑：齐夏「坚信余念安真实存在，不容任何人质疑」⇒ 象征物一旦被证伪，整个驱动力崩塌
      - 过度使用生生不息会带来认知混乱（原文对回响的通用限制），即造人者自身是第一个被消耗的
    counter:
      - 若你是对手：不要去杀象征物，要去证明它是被造出来的——动机的自证成本远高于它的物理存在
    patterns: [P3.C, P5.执念审计, P2.D2, P3.跨期复利]
    dedupe:
      - relation: extends
        ref: C23
        what_is_new: C23 已收录余念安的三重身份（执念/假余念安/造反代号）；本条把「造人计划」拆成动机层/棋子层/世界层三个用途，并新增 E2 级细节——余念安以燕知春身体+江若雪性格为蓝本、外形来自燕知春而面庞来自「业力」母神、性格表情来自齐夏本身；以及燕知春 YNA 文身与「智力强化」这一改造事实。
    evidence: E2

  - id: Q12
    name: 造反行动·假命令与「对位击杀」（用对手的编制执行自己的任务）
    category: 连环布局
    timeline: 造反之夜
    lines: "1051,1023-1043"
    what_happened:
      - 玉城所奉「刑官」（游戏拔河）在造反中提出对天级生肖进行「对位击杀」，其实是借齐夏名义编的任务，目的是让其余生肖拖住天级，以争取时间完成齐夏单独安排的任务——破坏列车上的门
      - 天鼠被地鼠用天鼠自己控制手下的爆炸项圈炸死
      - 天牛被极道的「眼球定位法」与蝼蚁攻击重伤，隐匿失效后被黑羊杀死；蝼蚁被解放
      - 天虎重创地虎，最后被黑羊设计利用蝼蚁杀死
      - 天马遇地马的对位击杀，中了地马设置的陷阱被炸断一条腿
      - 天蛇的房间门在混战中被摧毁，彻底失去逃出去的机会，最终在痛苦哀嚎中迷失虚空深处
      - 天鸡得知天猴真面目后强行用双生花把自己与天猴绑定并用疯长迅速老化，双双被蝼蚁杀死
    breakpoint:
      - （E3）公开目标与真实目标必须不同：公开目标（对位击杀八个天级）负责消耗与吸引注意力，真实目标是结构节点——列车上的「门」
      - 「借齐夏名义编的任务」= 用领导者的名义发布假指令，使执行者自愿完成对自己不利的消耗战；执行者不会怀疑，因为命令来自自己人
      - 让对手「内部分裂」比正面击破便宜：天鸡天猴的互绑（双生花+疯长）是它们自己完成的
    failure_lesson:
      - 假命令的风险是信息污染：一旦有人核对原始指令，整条链会塌；所以必须让「核对」的成本高于执行
      - 消耗战依赖被消耗方不知情，一旦知情，对位击杀会变成对方凝聚的借口
    counter:
      - 若你是被派任务的一方：任何「以他人名义」下达且风险不对等的任务，都应先向最高层做一次交叉验证
    patterns: [P3.O, P2.D2, P5.S6, P3.S3]
    dedupe:
      - relation: distinct
    evidence: E2

  - id: Q13
    name: 门即拓扑（战争的正确目标是边而不是节点）
    category: 结构战
    timeline: 造反之夜及前后
    lines: "442,1031,1156,1235-1236,1243,1051"
    what_happened:
      - 所谓「列车」拆开看是无数个可以穿梭的「门」，这些门连接着无数个不相邻的空间（即面试房间）；只有通过门才能进入长廊
      - 「不灭」回响者造出的门都通往疑似列车的空间
      - 天蛇因房间的门在混战中被摧毁，彻底失去逃出去的机会，最终迷失虚空深处
      - 玄武体内如宇宙的空间中有一个小洞被称为「门」，实为姜十被损坏的眼洞，可借此与外界「视频通话」
      - 造反中的真实任务是破坏列车上的门
    rule_basis:
      - 「不灭」以信念造成不死不灭，本质是创造「空间之门」规避伤害，所有不灭者的门都通往疑似列车的空间（line 442）
      - 列车即门阵列，连接不相邻空间（line 1235-1236）
    breakpoint:
      - （E3）终焉之地是一张图：门=边，房间=节点。控制边的集合比控制节点更有效——不必打败对手，只要让他无法抵达任何地方
      - 天蛇之死是这条规则的证明：摧毁门足以杀死一个天级，且不需要击败他
      - 「不灭」的机制本身也依赖门 ⇒ 所有以回避为核心的防御，其命门都在「门」的生成端
    failure_lesson:
      - 门是双向的：你破坏了对手的门，也可能破坏自己的退路（天蛇是死在自己的门被毁上，而白蛇也因此无法离开）
      - 控制边需要提前布局（知道门的分布图），否则只能在混战中盲拆
    counter:
      - 若你依赖门/通道/接口生存：必须有第二条不经过同一节点的通路，否则你的「不死」只是「还没人拆你的门」
    patterns: [P3.S3, P1.S3, P3.T]
    dedupe:
      - relation: distinct
    evidence: E2

  - id: Q14
    name: 玄武的眼球容器（一切「不灭」都有外置容器）
    category: 结构战
    timeline: 玄武之死
    lines: "109,1156"
    what_happened:
      - 「回响」存在于回响者的眼睛里，移植回响者的眼球可以获得「回响」
      - 玄武的回响包括「不灭」（一定程度的死不灭）、跃迁、探囊、滞空、忘忧
      - 邱十六进入玄武体内空间，发现一个小山村与一个和玄武脸一模一样的小女孩，女孩与玄武同步说话
      - 姜十与众人配合营造出「可接替玄武成为神兽」的假象；玄武将藏匿在背后代表「不灭」的眼球交给「液化」，眼球被融化后玄武死亡
    breakpoint:
      - （E3）所有「不死」都有外置容器：找到容器就找到了死亡条件；而容器通常被藏在「对手以为你不会去看」的位置（背后/体内）
      - 容器与本体同步（掐死体内女孩会同步伤害外部本体）⇒ 同步是双向攻击面：既能用容器杀本体，也可能因容器受损反噬
      - 「营造可接替的假象」是标准的逼退设计：不攻击本体，而是让本体自愿交出命门
    failure_lesson:
      - 玄武的失误不是不够强，而是把命门交给了一个可被说服的对象（她选择「交出眼球」而不是「毁灭眼球」）
      - 任何「不灭」的持有者都必须假定：有人会找到你的容器，且会用你的希望（求死/接班）来交换
    counter:
      - 若你拥有外置能力核心：把它变成「不可交付」的形式（无法被转移/无法被融化），否则它一定会被谈走
    patterns: [P1.S3, P2.D3, P4.S5, P5.画像]
    dedupe:
      - relation: distinct
    evidence: E2

  - id: Q15
    name: 反用控制装置（爆炸项圈）
    category: 心理战 / 结构战
    timeline: 造反之夜
    lines: "1023"
    what_happened:
      - 天鼠平时剥削、压榨并用爆炸项圈控制手下的地级生肖
      - 在造反中，天鼠被地鼠用它自己控制手下的爆炸项圈炸死
    breakpoint:
      - （E3）控制装置的所有权没有边界：谁戴着它，谁就最清楚它如何被触发
      - 因此「控制装置」是对控制者的负债：它把一批人集中到能杀死你的位置上
      - 可执行规则：任何用于控制下属的装置，必须假定下属会把它用在你身上；若无法承受，就不要部署
    failure_lesson:
      - 天鼠的控制方式同时提供了武器、动机与接触机会三要素，被反用只是时间问题
    counter:
      - 若你必须使用控制装置：把触发权交给与执行者无关的第三方，并让触发条件与自身位置绑定（避免被同归于尽）
    patterns: [P2.D3, P3.S6, P5.4.4]
    dedupe:
      - relation: distinct
    evidence: E2

  - id: Q16
    name: 蝼蚁杠杆（把最底层变成军队）
    category: 心理战 / 结构战
    timeline: 造反之夜
    lines: "1025,1027,1041,1043,1310-1312"
    what_happened:
      - 天牛是「蝼蚁」的看管者；被极道的眼球定位法与蝼蚁攻击重伤，最后被黑羊杀死，蝼蚁被解放
      - 天虎被黑羊设计利用蝼蚁杀死
      - 天鸡与天猴互绑老化后双双被蝼蚁杀死
      - 天兔被解放的蝼蚁杀死
      - 青龙曾给五官被剥夺的蝼蚁植入想法——只要能找到自己的五官，它们就能重新变成人，因此蝼蚁夜里四处收集筹码
    breakpoint:
      - （E3）蝼蚁的特征是「数量极大、单个无威胁、被一个虚构希望驱动」；这让它们同时是完美的兵源与完美的燃料
      - 齐夏一侧的做法是「解放 + 引导」而不是「命令」，因为群体不需要命令链，只需要一个方向
      - 关键设计：先让对手成为「看管者」（承担压制成本），再把看管关系解除，仇恨自动指向原看管者
    failure_lesson:
      - 被解放的群体会在胜利之后要求结算（它们的诉求是「变回人」，而这个承诺是青龙给的，齐夏并未真正兑现）⇒ 用虚构希望驱动的军队，最终会把账算到最后一个承诺者头上
      - 引导型群体的可控性极低，一旦方向错误，伤亡由自己承担
    counter:
      - 若你是看管者：不要成为唯一的施压者，否则解放之日你就是第一目标
    patterns: [P5.画像, P3.S3, P5.4.4, P1.元层]
    dedupe:
      - relation: distinct
    evidence: E2

  - id: Q17
    name: 洗牌谎言（目标函数被伪造）
    category: 元层
    timeline: 全程背景设定
    lines: "1248,1255,1262,1267,1280,1295,1298,1310-1312,3166"
    clue_refs:
      - 第 337 章「道的骗局」（E4 标题线索，仅用于定位；本条证据是下方 E1/E2 原文，判定不依赖标题）
    what_happened:
      - 五城筹码各有收集目标（道 3600、玉 57600、涡 3600、勾 1800、索 3600），传言集齐即可离开终焉之地
      - 但实际上若有参与者达到该数目，整座城的参与者会被「洗牌」
      - 筹码的制作材料都是人的器官：道=眼球、玉=牙齿、涡=耳蜗、勾=鼻子、索=眉毛
      - 青龙给五官被剥夺的蝼蚁植入「找到五官就能重新变成人」的想法，因此蝼蚁夜里四处收集筹码
    breakpoint:
      - （E3）这是一个元层骗局：目标本身是伪造的（收集=触发清洗），且收集物是参与者自己的身体器官——目标不仅不可达，还会自我消耗
      - 识别方法三步：① 谁宣布了目标；② 达成后谁受益；③ 达成时的实际机制（是离开，还是清洗）
      - 一旦目标函数被伪造，所有「努力」都在为对手服务；此时唯一的正确动作是停止参与并改换目标
    failure_lesson:
      - 绝大多数参与者从未质疑「集齐就能离开」这句话的来源，因为质疑的成本（放弃已有积累）高于继续收集
      - 沉没成本是这类骗局最好的守卫
    counter:
      - 若你是设计者：一个不可达的目标 + 器官作为筹码 + 「差一点就到」的进度条，是成本最低的长期控制装置
    patterns: [P1.元层, P2.D2, P5.S3, P5.画像]
    dedupe:
      - relation: upgrades_clue
        ref: X337
        what_is_new: 既有 casebook 的 X337 仅有章节标题「道的骗局」，证据级别为 chapter_title；本条把它升级为 E1/E2 级事实——五城收集阈值（道3600/玉57600/涡3600/勾1800/索3600）达到即触发「洗牌」、筹码材料为人体器官（眼球/牙齿/耳蜗/鼻子/眉毛）、青龙以「找回五官变回人」驱动蝼蚁收集。与 C02（极乐钱庄）无重叠。
    evidence: E2

  - id: Q18
    name: 新世界反杀（赢在结算层）
    category: 终局结算
    timeline: 终局
    lines: "592-593,643,707,1242-1243"
    what_happened:
      - 齐夏最终战胜「双龙」，代价是所有参与者的性命，只有齐夏与白虎存活
      - 齐夏在虚无中度过永恒，得到「神格」，并想出可以翻盘的最终计划
      - 天龙临死前「离析」所有人后只有齐夏与白虎逃离；齐夏坠入「永恒」，白虎留在终焉之地
      - 齐夏在永恒中用「生生不息」创造了一个新世界（血肉世界），并通过「门」回到终焉之地
      - 天龙被齐夏「设计为所有参与者建立了新世界」，最终被血肉世界打败消灭
      - 余念安最后在血肉世界中再次被创造，成为唯一陪伴齐夏的人
    breakpoint:
      - （E3）终局的胜负不在战场，而在结算规则：谁能定义「赢之后的世界」，谁就赢
      - 齐夏把「战斗胜负」替换成「世界归属」——天龙以为自己在新世界称王，实际那个新世界是齐夏造的，于是天龙的胜利条件被整体作废
      - 结构要点：先接受一次彻底失败（坠入永恒），在对手结算完之后再进入结算层
    failure_lesson:
      - 代价是几乎所有参与者的性命：这是一种「用全员的命换一个可结算的世界」的选择，其正当性由结果而非过程支撑
      - 一旦你的计划依赖「自己最后一个死」，你无法在过程中纠错，也无法向同伴解释
    counter:
      - 若你是胜利者：不要在对手消失后就停止思考「谁在造世界」——战利品可能本身是对方的产品
    patterns: [P3.T, P1.元层, P4.二阶承诺, P5.S5]
    dedupe:
      - relation: distinct
    evidence: E2

  - id: Q19
    name: 恻隐成本（宽恕必须伴随能力剥夺）
    category: 心理战
    timeline: 造反之夜
    lines: "1043,1058,1213"
    what_happened:
      - 地兔在对位击杀中因天兔哀求而心生恻隐，放过她一马，结果被天兔背刺
      - 天兔宁可沉溺于青龙的梦，也要背刺放过她的地兔，之后被解放的蝼蚁杀死
      - 地兔撑最后一口气去寻找天鼠，看到天鼠被地鼠杀死后，抱着「赢下去的希望」死去
      - 人兔（云瑶）因自己的游戏没有解法，被朱雀制裁而沦为癫人/原住民
    breakpoint:
      - （E3）在对抗性博弈中，宽恕必须被定价：若你不能保证对方在获宽恕后仍无法伤害你，宽恕就等于把自己的生存条件交给对方的情绪
      - 可执行规则：宽恕 = 能力剥夺 + 监督。没有剥夺能力的仁慈，只是延迟结算
      - 反面同样成立：一个「没有解法的游戏」（人兔）说明规则本身可以比人更残忍，此时应当投诉规则而不是硬打
    failure_lesson:
      - 地兔的失败不是善良，而是「善良但没有解除对方的武器」
      - 天兔的失败是：即使背刺成功，她仍在别人的梦里，最终被别人（蝼蚁）清算
    counter:
      - 若你是被宽恕者：不要用背刺回报，因为宽恕者往往是你唯一的退路（地兔是天兔对位击杀的目标，也是她能「活着」的唯一理由）
    patterns: [P5.S4, P4.S2, P2.识破即被骗]
    dedupe:
      - relation: distinct
    evidence: E2

  - id: Q20
    name: 执念审计（把最私人情感做成最大行动的掩护）
    category: 心理战
    timeline: 全程
    lines: "66-67,84-85,706-720,1291,3166"
    what_happened:
      - 齐夏以「寻找妻子余念安」作为想逃离终焉之地的重要原因，这也是他的弱点
      - 余念安在他的记忆里是妻子，实为其执念所造之物；他坚信其真实存在，不容任何人质疑
      - 第四次轮回中假余念安被创造、面试房间多出一人、假余念安两次自杀
      - 齐夏向无名老者解释：「余念安」实际上是这次造反的「名称」，目的是让心中所有杂余的念头安定下来（词条自注出处为第 1309 章，并注明这可能是他故意这么说以欺诈对方）
    breakpoint:
      - （E3）执念是最强杠杆，也是使用者本人最致命的破绽：任何知道执念的对手都能用它给你下指令
      - 「用一个最私人的名字给最大规模的行动命名」= 把注意力全部引向情感叙事，使真正的计划不被反推
      - 防御方法不是「没有执念」，而是「执念与关键决策解耦」：让执念只出现在可被解释为噪声的位置
    failure_lesson:
      - 原文明确余念安「不容任何人质疑」⇒ 一旦被证伪，驱动力与判断力同时崩塌
      - 用同一套叙事同时欺骗敌人与自己，风险是自己也信了
    counter:
      - 若你是对手：不要杀象征物，去证明它是被造出来的——自证的代价远大于物理破坏
      - 若你是执念的持有者：提前写好「若执念被证伪，我的决策规则是什么」，把答案放在执念之外
    patterns: [P5.执念审计, P3.S2, P2.D2, P5.4.4]
    dedupe:
      - relation: extends
        ref: C23
        what_is_new: C23 已收录余念安的三重身份与「1309 章造反代号」；本条新增 E2 级细节（外形来自燕知春、面庞来自「业力」母神、性格表情来自齐夏本身；原文同时提示「造反名称」之说可能也是欺诈），并把它上升为可执行的「执念审计」防御动作（执念与决策解耦）。
    evidence: E2

  - id: Q21
    name: 七年封存（把一批人停在时间之外）
    category: 连环布局
    timeline: 七年前至主故事
    lines: "1286,728,395"
    what_happened:
      - 陈俊南听从齐夏的命令，困住面试房间七年
      - 此前陈俊南与钱多多提出过「军队计划」，钱多多完善了猜想并实现：在「葫芦七兄弟」基础上建立了「猫」
      - 乔家劲离开组织并在某次轮回中丢失记忆；陈大娃与乔二娃因此产生分歧
    breakpoint:
      - （E3）把一批人「停」在时间之外，等价于在未来的某个时点拥有一个未被消耗的资源池；这是「长计划」的物理实现
      - 七年封存的代价是这支队伍完全不参与中间的所有博弈，因此必须由其他棋子（生肖中的「针」、猫、极道）在这期间维持局面
      - 「军队计划」是这套封存的制度化外壳：把私人交情组织化，才能在领导者消失七年后仍然运转
    failure_lesson:
      - 封存期间组织会发生内部裂变（陈俊南与乔家劲分歧、乔家劲失忆），说明「不动」的组织仍会腐烂
      - 依赖单一执行者（陈俊南）执行封存，一旦他改变主意，整个资源池会提前释放
    counter:
      - 若你要封存资源：必须同时封存「指挥链」与「共同目标」，否则解封时你得到的是另一支队伍
    patterns: [P3.跨期复利, P3.S, P5.S6]
    dedupe:
      - relation: distinct
    evidence: E2
